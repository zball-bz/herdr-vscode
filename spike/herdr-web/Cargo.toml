[package]
name = "herdr-web"
version = "0.0.0"
edition = "2024"
description = "Browser host for herdr-gpui's pane painter: one GPUI canvas fed by the sans-IO endpoint core"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1"
futures = "0.3"
gpui = { package = "gpui-pre", version = "=0.3.6" }
# Single-threaded: webviews are not cross-origin isolated, and the
# multithreaded feature needs nightly.
gpui_web = { package = "gpui-pre-web", version = "=0.3.6", default-features = false }
herdr-core = { path = "../herdr-core" }
herdr-pane-view = { path = "../../herdr-gpui/crates/herdr-pane-view" }
herdr-protocol = { path = "../../herdr-gpui/crates/herdr-protocol" }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCollection", "Node", "Performance", "Window", "console"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The IME candidate window follows the caret (see ../vendor/gpui-pre-web/PATCHES.md).
[patch.crates-io]
gpui-pre-web = { path = "../vendor/gpui-pre-web" }
