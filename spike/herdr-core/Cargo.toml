[package]
name = "herdr-core"
version = "0.0.0"
edition = "2024"
description = "Sans-IO herdr gen1 endpoint client core for WASM (VS Code webview / extension host)"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Unaffiliated extraction of herdr's stable gen1 wire model (Apache-2.0), from the
# local herdr-gpui fork that also provides herdr-pane-view.
herdr-protocol = { path = "../../herdr-gpui/crates/herdr-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
