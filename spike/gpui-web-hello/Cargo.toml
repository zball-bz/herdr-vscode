[package]
name = "gpui-web-hello"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.6" }
# Single-threaded: VS Code webviews are not cross-origin isolated (no SharedArrayBuffer), and the
# multithreaded feature needs nightly (wasm_thread).
gpui_web = { package = "gpui-pre-web", version = "=0.3.6", default-features = false }
console_error_panic_hook = "0.1"
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
